# ------------------------------------------------------------
# Insurance Policy Management System - Spring Boot configuration
# Uses an in-memory H2 database, so nothing needs to be installed.
# ------------------------------------------------------------

server.port=8080

# ---- Database (H2 in-memory) ----
spring.datasource.url=jdbc:h2:mem:insurance_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates the tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Run seed data (data.sql = available policy plans) after tables are created
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---- H2 web console (view tables in a browser: http://localhost:8080/h2-console) ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logs only exceptions
logging.level.org.springframework.security.web=INFO
